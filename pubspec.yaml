name: porquinho_app
description: "App de controle de depósitos tipo porquinho"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Gerenciamento de estado
  provider: ^6.1.2

  # Armazenamento local
  hive: ^2.2.3
  hive_flutter: ^1.1.0


  intl: ^0.19.0
  confetti: ^0.7.0
  google_mobile_ads: ^5.1.0




dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

  # 🔴 OBRIGATÓRIO PARA HIVE (GERAÇÃO DE CÓDIGO)
  build_runner: ^2.4.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true


  assets:
    - assets/icon/icon.png

flutter_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
